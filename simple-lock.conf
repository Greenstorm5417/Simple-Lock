# Colors are RRGGBB. A leading # or 0x is accepted.
idle 000000
input 005577
fail CC3333

# How long the fail color stays up, in milliseconds.
fail_ms 1000

# PAM service name. The stack is installed at /etc/pam.d/<service>.
service simple-lock

# Clock at the top of the lock. on or off.
clock on

# 24 keeps the hour 0-23. 12 draws AM/PM.
hours 24
